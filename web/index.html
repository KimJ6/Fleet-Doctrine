fieldset></div></details><details class="help"><summary aria-label="조작 도움말">ⓘ</summary><div class="help-content"><p>WASD·R/F 이동 · 드래그 회전 · 휠 확대</p><p>목적지 화면: WASD·드래그 이동, 클릭 선택</p><p>미니맵: 원은 아군, 마름모는 적군, ×는 목적지입니다.</p><p>함선을 드래그하거나 두 함선을 차례로 클릭해 교환합니다. 다른 함대 탭으로 드래그하면 이동합니다.</p></div></details></div><div id="patrol-editor" hidden><div id="patrol-points"></div><button id="patrol-add" type="button">경유점 추가</button><button id="patrol-save" type="button">경로 저장</button><button id="patrol-cancel" type="button">취소</button></div><div id="fleet-info"></div><div id="ships" aria-label="높이별 함선 편성"></div></div><div id="battle-action"><details id="economy-menu"><summary>구매·예비</summary><div id="economy-content"><strong>경순양함 01</strong> <span id="purchase-info"></span> <button id="buy-ship" type="button" disabled>구매</button><div id="reserves"></div></div></details><button id="start" disabled>전투 시작</button><button id="pause" hidden disabled>준비 단계로</button></div></section>
<script>
// Module dependencies can fail before main.js runs, so report startup errors here.
(function(){
  function report(message){const target=document.getElementById('error');if(target)target.textContent=message;}
  window.addEventListener('error',function(event){
    if(event.target && event.target.id==='game-module')report('게임 모듈을 불러오지 못했습니다. 네트워크 연결을 확인한 뒤 Ctrl+F5로 새로고침하세요.');
    else if(event.message)report('게임 초기화 오류: '+event.message);
  },true);
  window.addEventListener('unhandledrejection',function(event){report('게임 로딩 오류: '+(event.reason?.message||String(event.reason)));});
})();
</script>
